name: Source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source tree
        run: python tools/check_source_tree.py
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: JVM tests and contributor preview build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:testPreviewUnitTest :app:assemblePreview --no-daemon --console=plain
      - name: Preserve JVM failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-failure-reports
          path: app/build/test-results/**/TEST-*.xml
          retention-days: 3
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deployment/stak-server/requirements-dev.txt
      - name: Offline server tests
        working-directory: deployment/stak-server
        run: python -m pytest -q
