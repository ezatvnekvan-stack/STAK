<!doctype html>
<html lang="en" class="dark" data-theme="dark">
    <head>
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https: http:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="icon" href="%PUBLIC_URL%/icon.svg" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="theme-color" content="#080808" />
        <meta name="description" content="STAK — browse, track and manage your media libraries." />
        <link rel="stylesheet" href="%PUBLIC_URL%/fonts/fonts.css" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>STAK</title>
        <style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#080808;transition:opacity .18s ease,visibility .18s}
html[data-theme="light"] #splash{background:#f4f4f2}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.stak-launch{display:grid;justify-items:center;gap:12px;animation:stakSettle .38s cubic-bezier(.2,.7,.2,1) both}
.stak-launch img{width:96px;height:96px;border-radius:24px}
.stak-launch span{font:900 24px Doto,monospace;letter-spacing:.2em;color:#fff}
html[data-theme="light"] .stak-launch span{color:#111}
@keyframes stakSettle{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash,.stak-launch{animation:none!important;transition:none!important}}
html[data-reduced-motion="true"] #splash,html[data-reduced-motion="true"] .stak-launch{animation:none!important;transition:none!important}
</style>

        
        
    </head>
    <body>
        <div id="splash" aria-hidden="true"><div class="stak-launch"><img src="%PUBLIC_URL%/icon.svg" alt=""/><span>STAK</span></div></div>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        
    </body>
</html>
