name: Publish verified STAK 1.0 baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-baseline.yml', 'distribution/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged application and original APK
        run: |
          test "$(git rev-parse v1.0.0)" = '8b18ca813a851a686f3c8a6084d0047afa3abf45'
          git diff --exit-code v1.0.0 HEAD -- frontend scripts
          echo 'f88b544999ad02b9b438b9a2f31e29ec3e07f410f6b42a633bdd44fa91e7f963  distribution/STAK-1.0.0.apk' | sha256sum --check
          python3 scripts/verify_apk.py distribution/STAK-1.0.0.apk
          STAK_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$STAK_SDK/build-tools/35.0.0/apksigner" verify --print-certs distribution/STAK-1.0.0.apk > /tmp/stak-public-certificate.txt
          grep -q '75d337796ae863cd62b8cf265ee66685ffcc0c5935b553063eb050bf4887cf7c' /tmp/stak-public-certificate.txt
          "$STAK_SDK/build-tools/35.0.0/aapt" dump badging distribution/STAK-1.0.0.apk > /tmp/stak-identity.txt
          grep -q "name='app.dmmstudio.cinema' versionCode='38' versionName='1.0.0'" /tmp/stak-identity.txt
      - name: Prepare exact tagged source and checksums
        run: |
          mkdir release
          cp distribution/STAK-1.0.0.apk distribution/APK_CERTIFICATE.txt distribution/APK_IDENTITY.txt release/
          git archive --format=zip --prefix=STAK-1.0.0/ --output=release/STAK-1.0.0-source.zip v1.0.0
          cd release
          sha256sum STAK-1.0.0.apk STAK-1.0.0-source.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish baseline and verify download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          timeout 60s gh release upload v1.0.0 release/STAK-1.0.0.apk release/STAK-1.0.0-source.zip release/SHA256SUMS.txt release/APK_CERTIFICATE.txt release/APK_IDENTITY.txt
          timeout 20s gh release edit v1.0.0 --draft=false --latest
          timeout 60s gh release download v1.0.0 --pattern STAK-1.0.0.apk --dir /tmp/stak-release-download
          cmp release/STAK-1.0.0.apk /tmp/stak-release-download/STAK-1.0.0.apk
          sha256sum /tmp/stak-release-download/STAK-1.0.0.apk
