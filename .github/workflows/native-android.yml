name: Native Android
on:
  push:
    branches: [native-android-motion, native-original-parity, native-opencode-0.3, native-search-parity-build]
    paths: ['native-android/**', '.github/workflows/native-android.yml']
  pull_request:
    paths: ['native-android/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install project Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build, unit tests and lint
        working-directory: native-android
        run: |
          ./gradlew --no-daemon --max-workers=2 --build-cache assembleDebug assembleDebugAndroidTest assemblePreview
          ./gradlew --no-daemon --max-workers=2 --build-cache -PstakTestBuildType=preview assemblePreviewAndroidTest
          ./gradlew --no-daemon --max-workers=2 --no-build-cache testDebugUnitTest lintDebug
      - name: Verify APK identity, signature and search regressions
        run: |
          python3 native-android/scripts/verify_debug_artifact.py
          python3 native-android/scripts/verify_debug_artifact.py --variant preview
      - name: Upload verified native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: STAK-native-debug-${{ github.sha }}
          if-no-files-found: error
          path: |
            native-android/app/build/outputs/apk/debug/app-debug.apk
            native-android/app/build/verification/
      - name: Upload verified optimized native APK
        uses: actions/upload-artifact@v4
        with:
          name: STAK-native-optimized-${{ github.sha }}
          if-no-files-found: error
          path: |
            native-android/app/build/outputs/apk/preview/app-preview.apk
            native-android/app/build/verification/preview/
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native debug emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAK_EMULATOR_DIAGNOSTICS: ${{ github.workspace }}/native-runner-diagnostics/debug
        with:
          api-level: 35
          # Official archived stable 35.6.11 for the project API 35 baseline.
          emulator-build: 13610412
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          # Software GLES on the supported project/emulator baseline.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: bash native-android/scripts/trace_emulator.sh
          script: |
            bash native-android/ci-emulator.sh debug
      - name: Native optimized emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAK_EMULATOR_DIAGNOSTICS: ${{ github.workspace }}/native-runner-diagnostics/preview
        with:
          api-level: 35
          emulator-build: 13610412
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: bash native-android/scripts/trace_emulator.sh
          script: |
            bash native-android/ci-emulator.sh preview
      - name: Verify complete emulator coverage
        run: python3 native-android/scripts/verify_emulator_coverage.py
      - name: Retain runner diagnostics
        if: always()
        run: |
          mkdir -p native-runner-diagnostics
          free -m > native-runner-diagnostics/memory.txt
          (sudo dmesg --ctime || true) > native-runner-diagnostics/kernel.txt
      - name: Compare original and native captures
        if: always()
        run: |
          python3 -m pip install Pillow
          python3 native-android/parity/compare.py --native native-evidence/preview --output native-comparisons
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STAK-native-validation
          path: |
            native-android/app/build/outputs/apk/
            native-android/app/build/reports/
            native-android/app/build/test-results/
            native-android/app/build/verification/
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/outputs/mapping/preview/mapping.txt
            native-evidence/
            native-runner-diagnostics/
            native-comparisons/
            native-android/parity/reference-manifest.json
