name: Native Android
on:
  push:
    branches: [native-android-motion, native-original-parity]
    paths: ['native-android/**', '.github/workflows/native-android.yml']
  pull_request:
    paths: ['native-android/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build, unit tests and lint
        working-directory: native-android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash native-android/ci-emulator.sh
      - name: Compare original and native captures
        if: always()
        run: |
          python3 -m pip install Pillow
          python3 native-android/parity/compare.py --native native-evidence --output native-comparisons
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STAK-native-validation
          path: |
            native-android/app/build/outputs/apk/
            native-android/app/build/reports/
            native-android/app/build/outputs/androidTest-results/
            native-evidence/
            native-comparisons/
            native-android/parity/reference-manifest.json
